services:
  jobkar:
    build: .
    container_name: jobkar
    restart: unless-stopped
    ports:
      - "3658:3658"
    environment:
      - PORT=3658
      - NODE_ENV=production
    volumes:
      - ./volumes/settings.json:/app/settings.json:ro
      - ./volumes/data:/app/data
      - ./volumes/storage:/app/storage

volumes:
  jobkar_data:
    driver: local
  jobkar_storage:
    driver: local
